services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3100:8080"
    volumes:
      - archive_media_data:/var/lib/dreamjourney/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  async-effect-worker:
    build: .
    profiles:
      - async-effect-worker
    restart: "no"
    command: ["python", "-m", "app.worker", "--shadow-once"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  async-effect-scheduler:
    build: .
    profiles:
      - async-effect-scheduler
    restart: "no"
    command: ["python", "-m", "app.scheduler", "--shadow-once"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  owner-truth-candidate-extraction-worker:
    build: .
    profiles:
      - owner-truth-worker
    restart: unless-stopped
    stop_grace_period: 150s
    command: ["python", "-m", "app.async_effects.owner_truth_candidate_extraction_worker", "--loop"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  owner-truth-memory-projection-worker:
    build: .
    profiles:
      - owner-truth-worker
    restart: unless-stopped
    stop_grace_period: 150s
    command: ["python", "-m", "app.async_effects.owner_truth_memory_projection_worker", "--loop"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  owner-truth-media-processing-worker:
    build: .
    profiles:
      - owner-truth-media-worker
    restart: unless-stopped
    stop_grace_period: 150s
    command: ["python", "-m", "app.async_effects.owner_truth_media_processing_worker", "--loop"]
    env_file:
      - .env
    volumes:
      - archive_media_data:/var/lib/dreamjourney/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  owner-truth-media-deletion-worker:
    build: .
    profiles:
      - owner-truth-media-worker
    restart: unless-stopped
    stop_grace_period: 150s
    command: ["python", "-m", "app.async_effects.owner_truth_media_deletion_worker", "--loop"]
    env_file:
      - .env
    volumes:
      - archive_media_data:/var/lib/dreamjourney/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  business-message-projection-worker:
    build: .
    profiles:
      - business-message-worker
    restart: unless-stopped
    stop_grace_period: 150s
    command: ["python", "-m", "app.async_effects.business_message_projection_worker", "--loop"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: mirror.ccs.tencentyun.com/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dreamjourney
      POSTGRES_USER: dreamjourney
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamjourney -d dreamjourney"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: mirror.ccs.tencentyun.com/library/redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
  archive_media_data:
